name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cacapreco-app/backend/requirements.lock
    - name: Run Tests
      working-directory: cacapreco-app/backend
      run: |
        pytest
    - name: Build Docker Image
      working-directory: cacapreco-app/backend
      run: |
        docker build -t cacapreco-backend:latest .
    - name: Log in to OCI Container Registry
      run: |
        echo "${{ secrets.OCI_PASSWORD }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }} --username="${{ secrets.OCI_USERNAME }}" --password-stdin
    - name: Tag and Push Docker Image
      working-directory: cacapreco-app/backend
      run: |
        docker tag cacapreco-backend:latest ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
        docker push ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
    - name: Deploy to OCI VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.OCI_VM_HOST }}
        username: ${{ secrets.OCI_VM_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Log in to OCI Container Registry on the VM
          echo "${{ secrets.OCI_PASSWORD }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }} --username="${{ secrets.OCI_USERNAME }}" --password-stdin
          # Pull the latest Docker image
          docker pull ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
          # Stop and remove old container (if running)
          docker stop cacapreco-backend || true
          docker rm cacapreco-backend || true
          # Run the new container
          docker run -d --name cacapreco-backend -p 8000:8000 ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
