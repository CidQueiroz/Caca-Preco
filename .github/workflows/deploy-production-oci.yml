name: Deploy Backend to OCI (Production)

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  build_and_push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Basic Dependencies (Build Context)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: 4. Build Docker Image
        run: |
          docker build -t cacapreco-backend:latest ./backend

      - name: 5. Log in to OCI Container Registry
        run: |
          echo "${{ secrets.OCI_PASSWORD }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }} --username="${{ secrets.OCI_USERNAME }}" --password-stdin

      - name: 6. Tag and Push Docker Image
        run: |
          docker tag cacapreco-backend:latest ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
          docker push ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest

  deploy_oci:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: 1. Deploy to VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Parar e remover container anterior se existir
            docker stop cacapreco-backend || true
            docker rm cacapreco-backend || true
            
            # Login no Registry OCI na VM
            echo "${{ secrets.OCI_PASSWORD }}" | docker login ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }} --username="${{ secrets.OCI_USERNAME }}" --password-stdin
            
            # Pull da imagem mais recente
            docker pull ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest
            
            # Rodar o novo container (Ajuste as portas e envs conforme necessário)
            docker run -d --name cacapreco-backend -p 8000:8000 ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/cacapreco-backend:latest