# CDK TECK - Caça-Preço Infrastructure

services:
  db:
    image: mysql:8.0
    container_name: cacapreco_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testecacapreco_django
      MYSQL_USER: cacapreco_user
      MYSQL_PASSWORD: cacapreco_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      start_period: 40s

  redis:
    image: redis:6.2-alpine
    container_name: cacapreco_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cacapreco_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - GH_PAT=${GH_PAT}
    container_name: cacapreco_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  default:
    name: cacapreco_network